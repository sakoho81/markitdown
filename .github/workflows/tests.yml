name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - run: uv sync --frozen --all-packages

      - name: Run core tests
        run: uv run pytest packages/markitdown/tests/ -q
      - name: Run OCR tests
        run: uv run pytest packages/markitdown-ocr/tests/ -q
      - name: Run MCP tests
        run: uv run pytest packages/markitdown-mcp/tests/ -q
      - name: Run sample plugin tests
        run: uv run pytest packages/markitdown-sample-plugin/tests/ -q
