name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run core tests
        run: uv run pytest packages/markitdown/tests/
      - name: Run OCR tests
        run: uv run pytest packages/markitdown-ocr/tests/
      - name: Run MCP tests
        run: uv run pytest packages/markitdown-mcp/tests/
      - name: Run sample plugin tests
        run: uv run pytest packages/markitdown-sample-plugin/tests/
